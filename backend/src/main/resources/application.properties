spring.application.name=demo

# Datasource: defaults to H2 in-memory. To use Postgres, set env vars:
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/templ
# SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
# SPRING_DATASOURCE_USERNAME=youruser
# SPRING_DATASOURCE_PASSWORD=yourpass
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:templ;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-secure-value}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# BE1 AI provider configuration
app.ai.provider=${APP_AI_PROVIDER:stub}
app.ai.model=${APP_AI_MODEL:gpt-4o-mini}
app.ai.temperature=${APP_AI_TEMPERATURE:0.2}
app.ai.max-tokens=${APP_AI_MAX_TOKENS:800}

# BE2 analysis worker
app.worker.analyze.enabled=false
app.worker.analyze.fixed-delay-ms=5000

# BE2 OpenAI
app.openai.model=gpt-5.6-sol

# GitHub webhook
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# Slack Socket Mode
app.slack.socket-mode.enabled=${SLACK_SOCKET_MODE_ENABLED:false}
app.slack.bot-token=${SLACK_BOT_TOKEN:}
app.slack.app-token=${SLACK_APP_TOKEN:}
app.slack.project-id=${SLACK_PROJECT_ID:}

# Suggestion Policy Configuration
app.suggestion.policy.auto-regenerate-enabled=${SUGGESTION_AUTO_REGENERATE_ENABLED:false}
app.suggestion.policy.max-regeneration-depth=${SUGGESTION_MAX_REGENERATION_DEPTH:5}
app.suggestion.policy.impact-threshold=${SUGGESTION_IMPACT_THRESHOLD:0.6}
app.suggestion.policy.keywords=${SUGGESTION_KEYWORDS:API,schema,feature,conflict,endpoint,auth,login,spec,db,table}
app.suggestion.policy.min-edit-distance=${SUGGESTION_MIN_EDIT_DISTANCE:3}