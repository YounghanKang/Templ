spring.application.name=demo

# Datasource: defaults to H2 in-memory. To use Postgres, set env vars:
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/templ
# SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
# SPRING_DATASOURCE_USERNAME=youruser
# SPRING_DATASOURCE_PASSWORD=yourpass
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:templ;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console enabled when using default
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret (override in production via env var JWT_SECRET)
app.jwt.secret=${JWT_SECRET:change-me-to-a-secure-value}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# AI provider configuration: set APP_AI_PROVIDER=openai to enable OpenAIService, or leave unset to use stub
app.ai.provider=${APP_AI_PROVIDER:stub}
app.ai.model=${APP_AI_MODEL:gpt-4o-mini}
app.ai.temperature=${APP_AI_TEMPERATURE:0.2}
app.ai.max-tokens=${APP_AI_MAX_TOKENS:800}
